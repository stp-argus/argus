# ARGUS quick start — API 키 없이 로컬 클러스터(kind · minikube · Docker Desktop)에서
# "탐지 → 차단"을 5분 안에 본다.
#
#   helm install argus oci://ghcr.io/stp-argus/charts/argus --version 0.2.0 -n argus-system --create-namespace -f examples/quickstart.yaml
#
# 이 파일이 켜는 것: LiteLLM 게이트웨이 + ARGUS 가드레일 + 가상 키용 Postgres + mock 모델 + 정책(Observe).
# 운영 배포는 이 파일 대신 docs/production.md 를 따른다 (실제 모델 공급자, Secret 사전 생성, 영속 볼륨).

policy:
  enabled: true
  controlLevel: Observe          # 먼저 보고(Observe) → 확신이 서면 Enforce
  window: 60s
  cooldown: 30s
  detect:                        # dev 클러스터 실측 대조군에서 도출한 값 (argus docs/DETECTION.ko.md)
    duplicateCalls: {soft: 5, hard: 20}
    principalCalls: {soft: 17, hard: 19}
    runSteps: {soft: 9, hard: 18}
    conversationGrowth: {soft: "96.98", hard: "130.2"}
    rotationGap: {enabled: false}
    messageBytes: {enabled: false}
  backstop:
    principalCalls: 200
    teamCalls: 400
    budgetUSD: "1"
    failureMode: Open

litellm:
  enabled: true
  generateSecrets: true          # 마스터 키·DB 자격증명을 차트가 만든다
  providerKeySecret: ""          # mock 모델만 쓰니 공급자 키가 필요 없다
  models:
    # 어떤 모델 이름이 와도 mock 으로 — 실키·실비용 0. 비용은 LiteLLM 단가표로 가상 계산된다.
    - model_name: "*"
      litellm_params:
        model: openai/gpt-mock-4o
        api_base: http://mock-llm:18080/v1
        api_key: "sk-mock-not-checked"
        input_cost_per_token: 0.0001
        output_cost_per_token: 0.0003
  guardrail:
    enabled: true
  database:
    enabled: true
    persistence:
      enabled: false             # 빠른 시작은 휘발 — 지우면 가상 키도 사라진다
  records:
    enabled: true
    backup:
      enabled: false

mockUpstream:
  enabled: true

otel:
  enabled: false
